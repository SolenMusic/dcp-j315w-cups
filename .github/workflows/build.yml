name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native filter
        env:
          CFLAGS: -arch ${{ matrix.arch }} -mmacosx-version-min=11.0
        run: ./build.sh
      - name: Verify renderer and PDF pipeline
        run: |
          python3 test_reliability.py
          python3 test_discovery.py
          python3 test_status.py
          cc -std=c11 -Wall -Wextra -Werror make_geometry_probe.c $(cups-config --cflags --ldflags --libs) -o /tmp/make_geometry_probe
          python3 test_geometry.py /tmp/make_geometry_probe
          python3 test_macos.py
      - name: Package
        run: |
          ./package.sh macos '${{ matrix.arch }}'
          ./build-macos-installer.sh --unsigned
      - name: Verify Installer installation and upgrade
        run: sudo env GITHUB_ACTIONS=true "$(command -v python3)" test_macos_installer.py dist/*-unsigned.pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.pkg
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify portable Linux filter
        run: |
          docker build -f Dockerfile.release -t dcp-j315w-release .
          container=$(docker create dcp-j315w-release)
          mkdir -p release-filter
          docker cp "$container:/source/rastertodcpj315w" release-filter/rastertodcpj315w
          docker rm "$container"
      - name: Debian runtime and installation
        run: |
          docker build --build-arg RUNTIME_IMAGE=debian:bookworm-slim -f Dockerfile.runtime-test -t dcp-j315w-debian-check .
          docker run --rm dcp-j315w-debian-check
      - name: Fedora runtime and installation
        run: |
          docker build --build-arg RUNTIME_IMAGE=fedora:43 -f Dockerfile.runtime-test -t dcp-j315w-fedora-check .
          docker run --rm dcp-j315w-fedora-check
      - name: Arch runtime and installation
        if: matrix.arch == 'x86_64'
        run: |
          docker build --build-arg RUNTIME_IMAGE=archlinux:latest -f Dockerfile.runtime-test -t dcp-j315w-arch-check .
          # libcupsfilters 2.2.x/PDFio can silently discard compound-filter
          # content streams. Exercise the documented qpdf workaround explicitly.
          docker run --rm dcp-j315w-arch-check /bin/bash -c 'qpdf --stream-data=uncompress fixtures/print-options.pdf /tmp/normalized.pdf && DCPJ315W_PDF=/tmp/normalized.pdf python3 test_linux.py && python3 test_installation_linux.py'
      - name: openSUSE runtime and installation
        run: |
          docker build --build-arg RUNTIME_IMAGE=registry.opensuse.org/opensuse/tumbleweed:latest -f Dockerfile.runtime-test -t dcp-j315w-opensuse-check .
          docker run --rm dcp-j315w-opensuse-check
      - name: Package distribution flavours
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/source/dist" dcp-j315w-release /bin/bash -c './package.sh linux-debian ${{ matrix.arch }} && ./package.sh linux-fedora ${{ matrix.arch }} && ./package.sh linux-arch ${{ matrix.arch }} && ./package.sh linux-opensuse ${{ matrix.arch }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  alpine:
    name: Alpine musl ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native musl renderer and check raster geometry
        run: docker build -f Dockerfile.alpine-release -t dcp-j315w-alpine-release .
      - name: Alpine PDF pipeline and installation
        run: docker run --rm dcp-j315w-alpine-release
      - name: Package musl download
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/source/dist" dcp-j315w-alpine-release ./package.sh linux-alpine '${{ matrix.arch }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpine-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  nix:
    name: Nix ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: Build and check native Nix recipe
        run: nix-build nix/ci.nix --no-out-link
